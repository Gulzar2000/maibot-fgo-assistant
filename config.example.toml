[plugin]
enabled = true
config_version = "1.0.4"

[gacha]
display_mode = "image"
follow_pool_type = "latest"
# 每个 QQ 每日实际抽数：十一连消耗 11 次，百连消耗 110 次。
daily_limit = 100
# 每个 QQ 独立冷却；设为 0 时关闭。
cooldown_seconds = 15
auto_update_hours = 0

[real_statistics]
# 关闭后，同一账号当天重复查询也直接抓包。
confirm_repeat_capture = true
# 查询固定回复账号、AP、出率与评级，并附出率曲线。
# 图中吐槽使用插件内置固定句库，不调用模型。

# 活动别名：完整命中 aliases 后，匹配任意 titles 名称片段。
# 未配置 events 时自动使用以下默认规则；自定义 alias_rules 会替换整个列表。
# 若只需名称搜索，可配置 [events] 下 alias_rules = []。
# 查询忽略空白、英文大小写、全半角差异；结果仍显示实际活动名称。

